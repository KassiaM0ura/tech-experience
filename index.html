<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Experience 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header><h1>Tech Experience 2026</h1></header>

  <main>
    <form action="processar.php" method="post">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" required minlength="3">

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="experiencia">Nível de experiência</label>
      <select id="experiencia" name="experiencia" required>
        <option value="">Selecione</option>
        <option value="iniciante">Iniciante</option>
        <option value="intermediario">Intermediário</option>
        <option value="avancado">Avançado</option>
      </select>

      <fieldset>
        <legend>Turno de preferência</legend>
        <label><input type="radio" name="turno" value="manha"> Manhã</label>
        <label><input type="radio" name="turno" value="noite"> Noite</label>
      </fieldset>

      <fieldset>
        <legend>Oficinas de interesse</legend>
        <label><input type="checkbox" name="oficinas[]" value="html_css"> HTML e CSS</label>
        <label><input type="checkbox" name="oficinas[]" value="js_dom"> JavaScript e DOM</label>
        <label><input type="checkbox" name="oficinas[]" value="php_backend"> PHP Backend</label>
        <p id="erro-oficinas" class="error-message"></p>
      </fieldset>

      <label for="mensagem">Mensagem / Motivação</label>
      <textarea id="mensagem" name="mensagem" maxlength="200"></textarea>
      <span id="contador">Restam 200 caracteres</span>

      <button type="submit">Inscrever-se</button>
    </form>
  </main>

  <footer><p>Tech Experience 2026</p></footer>
</body>
</html>
